<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studioの認証状態と再利用</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>Studioの認証状態と再利用</h1><form id="form"><label>メール<input id="email"></label><label>パスワード<input id="password" type="password"></label><button>ログイン</button></form><section id="private" hidden><h2>YouTube風Studio</h2><button id="logout">ログアウト</button></section><p role="alert" id="error"></p><script>
const refresh=async()=>{const r=await fetch('/api/me');const ok=r.ok;form.hidden=ok;document.querySelector('#private').hidden=!ok;};form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});error.textContent=r.ok?'':'認証に失敗しました';await refresh();};logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});await refresh();};refresh();
</script></main></body></html>
