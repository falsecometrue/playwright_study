<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライブ配信のチャット同期</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>ライブ配信のチャット同期</h1><label>配信ID<input id="room" value="demo"></label><label>ユーザー名<input id="user" value="Alice"></label><button id="join">参加</button><form id="form"><label>メッセージ<input id="message"></label><button>送信</button></form><ul id="messages"></ul><script>
let activeRoom='',timer;const poll=async()=>{if(!activeRoom)return;const r=await fetch('/api/messages?room='+encodeURIComponent(activeRoom));const data=await r.json();messages.replaceChildren();data.messages.forEach(m=>{const li=document.createElement('li');li.textContent=m.user+'：'+m.text;messages.append(li);});};join.onclick=()=>{activeRoom=room.value;clearInterval(timer);poll();timer=setInterval(poll,250);};form.onsubmit=async e=>{e.preventDefault();if(!activeRoom||!message.value.trim())return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:activeRoom,user:user.value,text:message.value})});message.value='';await poll();};
</script></main></body></html>
