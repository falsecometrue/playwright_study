<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>再生リストのAPI準備と後片付け</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>再生リストのAPI準備と後片付け</h1><label>再生リストID<input id="playlist" value="demo"></label><button id="load">読み込む</button><ul id="items"></ul><script>
load.onclick=async()=>{const r=await fetch('/api/playlist-items?playlist='+encodeURIComponent(playlist.value));const data=await r.json();items.replaceChildren();data.items.forEach(t=>{const li=document.createElement('li');li.textContent=t.title+' ';const button=document.createElement('button');button.textContent='削除';button.onclick=async()=>{await fetch('/api/playlist-items/'+t.id+'?playlist='+encodeURIComponent(playlist.value),{method:'DELETE'});li.remove();};li.append(button);items.append(li);});};
</script></main></body></html>
