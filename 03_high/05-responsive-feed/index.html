<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画フィードのPage Objectと複数環境</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>動画フィードのPage Objectと複数環境</h1><button id="menu" aria-expanded="false">メニュー</button><nav aria-label="動画カテゴリ"><button id="all">すべて</button><button id="learning">学習</button></nav><ul id="videos"></ul><p role="status" id="cart">後で見る：0件</p><script>
const data=[{name:'Playwright入門動画',category:'learning'},{name:'音楽ライブ',category:'music'},{name:'テスト設計動画',category:'learning'}];let count=0;const render=category=>{videos.replaceChildren();data.filter(p=>!category||p.category===category).forEach(p=>{const li=document.createElement('li');const span=document.createElement('span');span.textContent=p.name;const button=document.createElement('button');button.textContent='追加';button.onclick=()=>cart.textContent='後で見る：'+(++count)+'件';li.append(span,button);videos.append(li);});};all.onclick=()=>render();learning.onclick=()=>render('learning');menu.onclick=()=>{const expanded=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(expanded));document.querySelector('nav').classList.toggle('open',expanded);};render();
</script></main></body></html>
