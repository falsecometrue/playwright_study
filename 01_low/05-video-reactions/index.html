<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画の高評価とチャンネル登録</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>動画の高評価とチャンネル登録</h1><section class="video-panel" aria-label="動画プレイヤー">▶ Playwright入門動画</section><section aria-label="動画アクション"><h2>Playwright入門動画</h2><button id="like" aria-pressed="false">高評価</button><p role="status" id="likes">高評価：100件</p></section><section aria-label="テスト学習チャンネル"><h2>テスト学習チャンネル</h2><button id="subscribe" aria-pressed="false">チャンネル登録</button><p role="status" id="subscription">未登録</p></section><script>let liked=false,subscribed=false;like.onclick=()=>{liked=!liked;like.setAttribute('aria-pressed',String(liked));likes.textContent='高評価：'+(100+Number(liked))+'件';};subscribe.onclick=()=>{subscribed=!subscribed;subscribe.setAttribute('aria-pressed',String(subscribed));subscribe.textContent=subscribed?'登録済み':'チャンネル登録';subscription.textContent=subscribed?'登録しました':'未登録';};</script></main></body></html>
