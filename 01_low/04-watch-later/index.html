<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>後で見るリストの管理</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>後で見るリストの管理</h1><form id="form"><label>動画タイトル<input id="task"></label><button>追加</button></form><ul id="list"></ul><script>
form.onsubmit=e=>{e.preventDefault();if(!task.value.trim())return;const li=document.createElement('li');const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';label.append(box,document.createTextNode(task.value));box.onchange=()=>li.dataset.completed=String(box.checked);const button=document.createElement('button');button.textContent='削除';button.onclick=()=>li.remove();li.append(label,button);list.append(li);task.value='';};
</script></main></body></html>
