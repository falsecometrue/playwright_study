<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コメント投稿の入力検証</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>コメント投稿の入力検証</h1><section class="video-panel" aria-label="動画プレイヤー">▶ Playwright入門動画</section><form id="form" novalidate><label for="author">表示名</label><input id="author"><label for="comment">コメント</label><textarea id="comment"></textarea><button>コメントを投稿</button></form><p role="alert" id="error"></p><p role="status" id="result"></p><script>form.onsubmit=e=>{e.preventDefault();result.textContent='';const text=comment.value.trim();error.textContent=!author.value.trim()?'表示名を入力してください':text.length<3?'コメントは3文字以上です':text.length>100?'コメントは100文字以内です':'';if(!error.textContent)result.textContent=author.value.trim()+'：'+text;};</script></main></body></html>
