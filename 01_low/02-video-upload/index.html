<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画の投稿設定</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>動画の投稿設定</h1><form id="form"><label for="titleInput">動画タイトル</label><input id="titleInput" required><label for="visibility">公開設定</label><select id="visibility"><option>非公開</option><option>限定公開</option><option>公開</option></select><label><input id="rights" type="checkbox" required>著作権を確認しました</label><button>投稿設定を保存</button></form><p role="status" id="result"></p><script>form.onsubmit=e=>{e.preventDefault();result.textContent=titleInput.value+'：'+visibility.value+'で保存しました';};</script></main></body></html>
