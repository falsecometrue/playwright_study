<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>埋め込みプレイヤー</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>埋め込みプレイヤー</h1><section class="video-panel">▶ Playwright入門動画</section><label for="position">再生位置（秒）</label><input id="position" type="number" value="0" min="0" max="120"><button id="seek">移動</button><button id="play" aria-pressed="false">再生</button><p role="status" id="result">再生位置：0秒</p><script>seek.onclick=()=>{if(position.checkValidity())result.textContent='再生位置：'+position.value+'秒';};play.onclick=()=>{const playing=play.getAttribute('aria-pressed')!=='true';play.setAttribute('aria-pressed',String(playing));play.textContent=playing?'一時停止':'再生';};</script></main></body></html>
