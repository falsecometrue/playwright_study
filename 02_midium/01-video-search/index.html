<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画検索と読み込み待機</title><link rel="stylesheet" href="/assets/theme.css"></head><body><header class="site-header"><a class="brand" href="/">TubeLab</a><span class="header-note">YouTubeをテーマにしたPlaywright練習サイト</span></header><main class="content"><p class="eyebrow">PLAYWRIGHT TRAINING / VIDEO PLATFORM</p><h1>動画検索と読み込み待機</h1><form id="form"><label>動画を検索<input id="query"></label><button id="search">検索</button></form><p role="status" id="status"></p><ul id="results"></ul><script>
const status = document.querySelector("#status");
form.onsubmit=async e=>{e.preventDefault();search.disabled=true;status.textContent='検索中';results.replaceChildren();const response=await fetch('/api/search?q='+encodeURIComponent(query.value));const data=await response.json();data.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;results.append(li);});status.textContent=data.items.length+'件';search.disabled=false;};
</script></main></body></html>
